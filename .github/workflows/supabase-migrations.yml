name: Supabase migrations

# Order of operations: every migration (0001-0005 today, 0006+ later) must be
# applied to STAGING first and only then to PRODUCTION. The production job is
# gated by the `production` environment (manual approval + required reviewers)
# and can never run until staging succeeded in the same execution.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to push migrations
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: both
      dry_run:
        description: Dry run (list pending migrations, apply nothing)
        required: false
        type: boolean
        default: true

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  list-migrations:
    name: Show migrations (0001-0005 core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List pending migration files
        run: ls -1 supabase/migrations

  staging:
    name: Push migrations → STAGING
    if: ${{ inputs.target == 'staging' || inputs.target == 'both' }}
    needs: list-migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging ref
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_STAGING_PROJECT_REF secret is not configured"
            exit 1
          fi
      - name: supabase db push (${{ inputs.dry_run && 'dry-run' || 'apply' }})
        working-directory: supabase
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          npx --yes supabase@latest db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --workdir . \
            $ARGS

  production:
    name: Push migrations → PRODUCTION
    if: ${{ inputs.target == 'production' || inputs.target == 'both' }}
    needs: [list-migrations, staging]
    environment: production
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
      STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production ref
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PRODUCTION_PROJECT_REF secret is not configured"
            exit 1
          fi
          if [ -n "$STAGING_REF" ] && [ "$SUPABASE_PROJECT_REF" = "$STAGING_REF" ]; then
            echo "::error::staging and production refs are identical — refusing"
            exit 1
          fi
      - name: supabase db push (${{ inputs.dry_run && 'dry-run' || 'apply' }})
        working-directory: supabase
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          npx --yes supabase@latest db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --workdir . \
            $ARGS
