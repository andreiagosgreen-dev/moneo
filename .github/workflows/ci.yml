name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck-test-build:
    name: Typecheck + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ci
      - run: node scripts/perf-budget.mjs

  supply-chain:
    name: Audit + Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run secret-scan

  deploy:
    name: Deploy (Cloudflare)
    needs: [lint, typecheck-test-build]
    # Production releases are manual: push to main keeps running CI checks,
    # deploying requires an explicit workflow_dispatch + `production` approval.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Build-time (public) config baked into the SPA. Stored as repository
      # secrets; never service keys.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_LEMONSQUEEZY_STORE_ID: ${{ secrets.VITE_LEMONSQUEEZY_STORE_ID }}
      VITE_LEMONSQUEEZY_CHECKOUT_URL: ${{ secrets.VITE_LEMONSQUEEZY_CHECKOUT_URL }}
      VITE_LEMONSQUEEZY_MONTHLY_VARIANT_ID: ${{ secrets.VITE_LEMONSQUEEZY_MONTHLY_VARIANT_ID }}
      VITE_LEMONSQUEEZY_YEARLY_VARIANT_ID: ${{ secrets.VITE_LEMONSQUEEZY_YEARLY_VARIANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install worker deps (wrangler)
        run: npm ci
        working-directory: cloudflare/workers
      - name: Upload assets to R2
        env:
          R2_BUCKET_NAME: moneo-assets
        run: node scripts/deploy-assets.mjs
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: cloudflare/workers
      - name: Verify DNS + edge after deploy
        run: node scripts/check-dns.mjs
