name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck-test-build:
    name: Typecheck + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:ci

  supply-chain:
    name: Audit + Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run secret-scan

  deploy:
    name: Deploy (Cloudflare)
    needs: [lint, typecheck-test-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Publishable/public values only (never a secret key) — baked into the
      # client bundle by Vite, so they are not sensitive here either.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_LEMONSQUEEZY_STORE_ID: ${{ vars.VITE_LEMONSQUEEZY_STORE_ID }}
      VITE_LEMONSQUEEZY_CHECKOUT_URL: ${{ vars.VITE_LEMONSQUEEZY_CHECKOUT_URL }}
      VITE_LEMONSQUEEZY_MONTHLY_VARIANT_ID: ${{ vars.VITE_LEMONSQUEEZY_MONTHLY_VARIANT_ID }}
      VITE_LEMONSQUEEZY_YEARLY_VARIANT_ID: ${{ vars.VITE_LEMONSQUEEZY_YEARLY_VARIANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install worker deps (wrangler)
        run: npm ci
        working-directory: cloudflare/workers
      - name: Upload assets to R2
        env:
          R2_BUCKET_NAME: moneo-assets
        run: node scripts/deploy-assets.mjs
      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: cloudflare/workers
