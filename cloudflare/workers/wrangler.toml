name = "moneo"
main = "index.ts"
compatibility_date = "2024-09-01"

# ─── Custom Domain ─────────────────────────────────────────────────────────────
# Binding the worker to moneo.bond fixes the 522 error.
# Cloudflare routes requests for this domain directly to the worker
# instead of looking for an origin server (which caused the 522).
routes = [
  { pattern = "moneo.bond", custom_domain = true },
  # www has a proxied DNS record; the worker 301s it to the apex.
  { pattern = "www.moneo.bond/*", zone_name = "moneo.bond" },
]

# Disable default *.workers.dev URL (optional – set true to keep it)
workers_dev = false

# ─── Observability ─────────────────────────────────────────────────────────────
# Mirrors Workers Logs + Traces enabled in the dashboard, so `wrangler deploy`
# from CI does not reset them.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Public config (not secret — safe to commit). Real secrets
# (SUPABASE_SERVICE_ROLE_KEY, LEMON_SQUEEZY_WEBHOOK_SECRET) are set via
# `wrangler secret put` instead, never here.
[vars]
SUPABASE_URL = "https://yvkguiiqojwyosvkxzbt.supabase.co"
# Complimentary Pro emails (Free branding + full unlock). Comma-separated;
# Server-only gifted-Pro allowlist (also COMPLIMENTARY_PRO_EMAILS in complimentaryPro.ts).
# PRO_COMPLIMENTARY_EMAILS = "you@example.com,other@example.com"
# Lemon numeric variant + product ids per billing interval (public — shown on
# the checkout page). Fallback when unset: "Yearly"/"Monthly" in product name.
LEMON_YEARLY_IDS = "2156050,1380216"
LEMON_MONTHLY_IDS = "2156059,1380224"
# Lemon test-mode webhooks (`meta.test_mode: true`) are acknowledged without
# granting Pro. Set to "true" only while testing checkout in Lemon Test mode,
# then back to "false" and redeploy.
ALLOW_TEST_MODE = "false"
# Included AI planner (Pro). The key is a SECRET:
#   npx wrangler secret put AI_API_KEY
# Any OpenAI-compatible API works; defaults: https://api.openai.com/v1 + gpt-4o-mini.
# AI_BASE_URL = "https://api.openai.com/v1"
# AI_MODEL = "gpt-4o-mini"
# Plans per Pro account per UTC day (cost guard, counted in KV_CACHE).
AI_DAILY_LIMIT = "20"

# Anonymous funnel counters (POST /api/event). Enable Workers Analytics Engine
# in the Cloudflare dashboard, then uncomment. Without it /api/event is a no-op.
# [[analytics_engine_datasets]]
# binding = "EVENTS"
# dataset = "moneo_events"
# Rank discount codes (/api/billing/discount, first month of Pro monthly) are
# created in this store and limited to this numeric variant id (public). Needs
# the LEMON_SQUEEZY_API_KEY secret; without it the endpoint answers 503
# not_configured.
LEMON_STORE_ID = "478882"
LEMON_MONTHLY_VARIANT_ID = "2156059"

# KV namespace for caching
[[kv_namespaces]]
binding = "KV_CACHE"
id = "75386684902b4b80b85db1ddcc01b5fb"
preview_id = "75386684902b4b80b85db1ddcc01b5fb"

# R2 bucket for static assets
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "moneo-assets"
