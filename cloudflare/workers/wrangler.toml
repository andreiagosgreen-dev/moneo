name = "moneo"
main = "index.ts"
compatibility_date = "2024-09-01"

# ─── Custom Domain ─────────────────────────────────────────────────────────────
# Binding the worker to moneo.bond fixes the 522 error.
# Cloudflare routes requests for this domain directly to the worker
# instead of looking for an origin server (which caused the 522).
routes = [
  { pattern = "moneo.bond", custom_domain = true },
  # www has a proxied DNS record; the worker 301s it to the apex.
  { pattern = "www.moneo.bond/*", zone_name = "moneo.bond" },
]

# Disable default *.workers.dev URL (optional – set true to keep it)
workers_dev = false

# Public config (not secret — safe to commit). Real secrets
# (SUPABASE_SERVICE_ROLE_KEY, LEMON_SQUEEZY_WEBHOOK_SECRET) are set via
# `wrangler secret put` instead, never here.
[vars]
SUPABASE_URL = "https://yvkguiiqojwyosvkxzbt.supabase.co"
# Complimentary Pro emails (Free branding + full unlock). Comma-separated;
# mirror VITE_PRO_COMPLIMENTARY_EMAILS / COMPLIMENTARY_PRO_EMAILS in code.
# PRO_COMPLIMENTARY_EMAILS = "you@example.com,other@example.com"

# KV namespace for caching
[[kv_namespaces]]
binding = "KV_CACHE"
id = "75386684902b4b80b85db1ddcc01b5fb"
preview_id = "75386684902b4b80b85db1ddcc01b5fb"

# R2 bucket for static assets
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "moneo-assets"
