<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="moneo-plate" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1b33" />
      <stop offset="52%" stop-color="#080f1f" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>
    <radialGradient id="moneo-ambient" cx="50%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050914" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="moneo-m" x1="26" y1="28" x2="102" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="moneo-gold" x1="56" y1="22" x2="72" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="moneo-rim" x1="18" y1="10" x2="110" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Sculpted obsidian squircle plate -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#moneo-plate)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#moneo-ambient)" />
  <rect x="5.25" y="5.25" width="117.5" height="117.5" rx="26.75" stroke="url(#moneo-rim)" stroke-width="2.5" />

  <!-- Subtle precision chronometer orbit ring -->
  <circle cx="64" cy="64" r="46" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.6" stroke-dasharray="14 8" />

  <!-- Architectural geometric "M" ribbon monogram -->
  <path
    d="M31 93V41.5C31 36.2 37.3 33.4 41.2 37L64 58.2L86.8 37C90.7 33.4 97 36.2 97 41.5V93"
    stroke="url(#moneo-m)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Subtle inner depth highlight on M -->
  <path
    d="M31 93V41.5C31 36.2 37.3 33.4 41.2 37L64 58.2L86.8 37C90.7 33.4 97 36.2 97 41.5V93"
    stroke="#e0f2fe"
    stroke-opacity="0.35"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Zenith Focus Apex Diamond / Chronometer Node -->
  <path d="M64 23L71.5 32.5L64 42L56.5 32.5L64 23Z" fill="url(#moneo-gold)" />
  <circle cx="64" cy="79" r="4.5" fill="#38bdf8" fill-opacity="0.9" />
</svg>
